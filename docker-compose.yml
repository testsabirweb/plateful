services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: plateful
      POSTGRES_PASSWORD: plateful
      POSTGRES_DB: plateful
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plateful -d plateful"]
      interval: 2s
      timeout: 5s
      retries: 15

  localstack:
    image: localstack/localstack:3.0
    ports:
      - "4566:4566"
    environment:
      SERVICES: sqs
      DEBUG: "0"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:4566/_localstack/health >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  migrate:
    image: migrate/migrate:v4.18.3
    command:
      - "-path=/migrations"
      - "-database=postgres://plateful:plateful@postgres:5432/plateful?sslmode=disable"
      - "up"
    volumes:
      - ./db/migrations:/migrations
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    ports:
      - "8080:8080"
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://plateful:plateful@postgres:5432/plateful?sslmode=disable
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_NAME: plateful-orders
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      postgres:
        condition: service_healthy
      localstack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      SQS_ENDPOINT: http://localstack:4566
      SQS_QUEUE_NAME: plateful-orders
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    depends_on:
      localstack:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
